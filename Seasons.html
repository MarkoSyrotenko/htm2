<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Seasons</title>
    </head>
    <body>
        <h3><b>Seasons</b></h3>
        <details>
            <summary>Winter</summary>
            <ol style="list-style-type: decimal-leading-zero; list-style-image:url('winter_16.png');">
                <li>December</li>
                <li>January</li>
                <li>February</li>
            </ol>
        </details>
        <details>
            <summary>Spring</summary>
            <ol style="list-style-type: decimal-leading-zero; list-style-image:url('spring_16.png')">
                <li>March</li>
                <li>April</li>
                <li>May</li>
            </ol>
        </details>
        <details>
            <summary>Summer</summary>
            <ol style="list-style-type: decimal-leading-zero; list-style-image:url('summer_16.png')">
                <li>June</li>
                <li>July</li>
                <li>August</li>
            </ol>
        </details>
        <details>
            <summary>Autumn</summary>
            <ol style="list-style-type: decimal-leading-zero; list-style-image:url('autumn_16.png')">
                <li>September</li>
                <li>October</li>
                <li>November</li>
            </ol>
        </details>
    </body>
</html>
